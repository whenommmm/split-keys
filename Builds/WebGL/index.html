<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12101C">
    <title>Split Keys</title>
    <meta name="description" content="One phrase. 20 seconds. Everyone has different letters.">
    <meta property="og:title" content="Split Keys">
    <meta property="og:description" content="One phrase. 20 seconds. Everyone has different letters. Join my room!">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CclipPath id='c'%3E%3Crect x='6' y='4' width='52' height='48' rx='12'/%3E%3C/clipPath%3E%3C/defs%3E%3Crect x='6' y='10' width='52' height='48' rx='12' fill='%232A2640'/%3E%3Cg clip-path='url(%23c)'%3E%3Crect x='6' y='4' width='52' height='48' fill='%234DABF7'/%3E%3Cpath d='M58 4 L58 52 L6 52 Z' fill='%23FF922B'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: dark; --bg: #12101C; --mat: #1B1829; --line: #34304A; --text: #F4F1FF; --muted: #A19BBE; --cream: #FFF3D6; --danger: #FF5252; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
      body {
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(151,117,250,.16), transparent 70%),
          radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0) 0 0 / 22px 22px,
          var(--bg);
        font-family: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--text);
        -webkit-tap-highlight-color: transparent;
      }
      #unity-canvas {
        position: fixed;
        top: env(safe-area-inset-top); right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
        width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
        height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        background: var(--bg);
        touch-action: none;
        outline: none;
      }
      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 24px; text-align: center; transition: opacity .3s ease;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      .logo { display: grid; gap: 6px; justify-items: center; }
      .row { display: flex; gap: 6px; }
      .row + .row { margin-left: 29px; }
      .cap {
        width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
        font: 28px/1 Bungee, "Arial Black", sans-serif; color: #15121F;
        box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 5px 0 rgba(0,0,0,.45);
        animation: press 3s infinite;
      }
      @keyframes press { 0%, 8%, 100% { transform: translateY(0); } 4% { transform: translateY(4px); } }
      #bar { width: min(280px, 70vw); height: 10px; border-radius: 999px; background: #252137; overflow: hidden; }
      #fill { height: 100%; width: 0; background: var(--cream); border-radius: 999px; transition: width .2s ease; }
      #status { color: var(--muted); font-size: 15px; min-height: 1.4em; max-width: 320px; }
      #status.error { color: var(--danger); }
      @media (prefers-reduced-motion: reduce) { .cap { animation: none; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader" role="status" aria-live="polite">
      <div class="logo" role="img" aria-label="Split Keys">
        <div class="row" aria-hidden="true">
          <span class="cap" style="background:#4DABF7;rotate:-4deg">S</span>
          <span class="cap" style="background:#FF922B;rotate:2deg;animation-delay:.09s">P</span>
          <span class="cap" style="background:#A9E34B;rotate:-2deg;animation-delay:.18s">L</span>
          <span class="cap" style="background:#F783AC;rotate:3deg;animation-delay:.27s">I</span>
          <span class="cap" style="background:#FFD43B;rotate:-1deg;animation-delay:.36s">T</span>
        </div>
        <div class="row" aria-hidden="true">
          <span class="cap" style="background:#9775FA;rotate:2deg;animation-delay:.45s">K</span>
          <span class="cap" style="background:#38D9A9;rotate:-3deg;animation-delay:.54s">E</span>
          <span class="cap" style="background:#E3DEF5;rotate:1deg;animation-delay:.63s">Y</span>
          <span class="cap" style="background:#4DABF7;rotate:-2deg;animation-delay:.72s">S</span>
        </div>
      </div>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Loading the game…</div>
    </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      (function () {
        var fill = document.getElementById("fill");
        var status = document.getElementById("status");
        var slow = setTimeout(function () {
          status.textContent = "Still loading. The first visit can take up to a minute.";
        }, 8000);
        createUnityInstance(document.getElementById("unity-canvas"), {
          arguments: [],
          dataUrl: "Build/WebGL.data.br",
          frameworkUrl: "Build/WebGL.framework.js.br",
          codeUrl: "Build/WebGL.wasm.br",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Split Keys",
          productVersion: "0.1.0",
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          showBanner: function (message, type) {
            if (type === "error") { status.className = "error"; status.textContent = message; }
          }
        }, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
        }).then(function (instance) {
          clearTimeout(slow);
          window.splitKeysInstance = instance;
          document.getElementById("loader").className = "done";
          document.getElementById("unity-canvas").focus();
        }).catch(function (message) {
          clearTimeout(slow);
          status.className = "error";
          status.textContent = "The game couldn't start in this browser. " + message;
        });
      })();
    </script>
  </body>
</html>
