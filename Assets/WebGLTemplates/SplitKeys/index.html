<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2E86FF">
    <title>{{{ PRODUCT_NAME }}}</title>
    <meta name="description" content="A 2v2 drawing game. Pick an easy, medium or hard word, draw it, and your teammate guesses. Riskier words score more.">
    <meta property="og:title" content="Split Keys">
    <meta property="og:description" content="2v2 drawing game in your browser. Pick a risky word, draw it, beat the other team. Join my room!">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CclipPath id='c'%3E%3Crect x='6' y='4' width='52' height='50' rx='12'/%3E%3C/clipPath%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='58' rx='14' fill='%2317141F'/%3E%3Cg clip-path='url(%23c)'%3E%3Crect x='6' y='4' width='52' height='50' fill='%232E86FF'/%3E%3Cpath d='M58 4 L58 54 L6 54 Z' fill='%23FF7A1A'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <style>
      :root { --sky: #2E86FF; --tangerine: #FF7A1A; --ink: #17141F; --sun: #FFD23F; --danger: #FF3B3B; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--sky); }
      body {
        background: linear-gradient(97deg, var(--sky) 0 50%, var(--tangerine) 50% 100%);
        font-family: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #fff;
        -webkit-tap-highlight-color: transparent;
      }
      @media (max-aspect-ratio: 1/1) {
        body { background: linear-gradient(173deg, var(--sky) 0 46%, var(--tangerine) 46% 100%); }
      }
      #unity-canvas {
        position: fixed;
        top: env(safe-area-inset-top); right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
        width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
        height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        background: transparent;
        touch-action: none;
        outline: none;
      }
      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; padding: 24px; text-align: center; transition: opacity .3s ease;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      .logo {
        font: 72px/0.92 "Lilita One", "Arial Black", sans-serif; transform: rotate(-4deg);
        -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink);
      }
      .logo span { display: block; }
      .logo span + span { color: var(--sun); }
      #bar { width: min(280px, 70vw); height: 16px; border-radius: 999px; background: var(--ink); padding: 3px; box-sizing: border-box; }
      #fill { height: 100%; width: 0; background: var(--sun); border-radius: 999px; transition: width .2s ease; }
      #status { font-weight: 700; font-size: 16px; min-height: 1.4em; max-width: 320px; text-shadow: 0 2px 0 var(--ink); }
      #status.error { color: #fff; background: var(--danger); border: 3px solid var(--ink); border-radius: 12px; padding: 8px 12px; text-shadow: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader" role="status" aria-live="polite">
      <div class="logo" role="img" aria-label="Split Keys"><span aria-hidden="true">SPLIT</span><span aria-hidden="true">KEYS</span></div>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Loading the game…</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      (function () {
        var fill = document.getElementById("fill");
        var status = document.getElementById("status");
        var slow = setTimeout(function () {
          status.textContent = "Still loading. The first visit can take up to a minute.";
        }, 8000);
        createUnityInstance(document.getElementById("unity-canvas"), {
          arguments: [],
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
          workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          showBanner: function (message, type) {
            if (type === "error") { status.className = "error"; status.textContent = message; }
          }
        }, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
        }).then(function (instance) {
          clearTimeout(slow);
          window.splitKeysInstance = instance;
          document.getElementById("loader").className = "done";
          document.getElementById("unity-canvas").focus();
        }).catch(function (message) {
          clearTimeout(slow);
          status.className = "error";
          status.textContent = "The game couldn't start in this browser. " + message;
        });
      })();
    </script>
  </body>
</html>
